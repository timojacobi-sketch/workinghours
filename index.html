<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arbeitszeiterfassung</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --surface2: #222222;
      --border: #2e2e2e;
      --accent: #c8f04b;
      --accent2: #4bf0b0;
      --text: #f0f0f0;
      --muted: #666;
      --error: #ff5c5c;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 3rem;
      animation: fadeDown 0.6s ease both;
    }

    .kw-badge {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 2px 8px;
      margin-bottom: 0.75rem;
      letter-spacing: 0.08em;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    h1 span { color: var(--accent); }

    .subtitle {
      margin-top: 0.5rem;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 400;
    }

    /* Day cards */
    .days-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.5s ease both;
    }

    .day-card:hover {
      border-color: #444;
      box-shadow: 0 0 0 1px #2a2a2a;
    }

    .day-card.has-data { border-color: #2e4a1a; }
    .day-card.has-data:hover { border-color: var(--accent); }

    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .day-name {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .day-result {
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      color: var(--accent);
      background: rgba(200,240,75,0.08);
      border: 1px solid rgba(200,240,75,0.2);
      border-radius: 6px;
      padding: 3px 10px;
      min-width: 80px;
      text-align: center;
      transition: opacity 0.3s;
    }

    .day-result.empty { color: var(--muted); border-color: transparent; background: transparent; }

    .inputs-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .inputs-row .field.full {
      grid-column: span 2;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 1.15rem;
      padding: 0.8rem 0.75rem;
      outline: none;
      width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
      text-align: center;
    }

    input[type="time"] {
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    input[type="time"]::-webkit-date-and-time-value {
      text-align: center;
    }

    input[type="time"]::-webkit-calendar-picker-indicator {
      display: none;
    }

    input[type="text"] {
      text-align: left;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,240,75,0.12);
    }

    input::placeholder { color: var(--muted); opacity: 0.5; }

    input.error { border-color: var(--error); }

    /* Summary */
    .summary {
      margin-top: 2.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.75rem 2rem;
      animation: fadeUp 0.6s 0.3s ease both;
    }

    .summary-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .summary-total {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--accent);
    }

    .summary-total .unit {
      font-size: 0.4em;
      font-weight: 600;
      color: var(--muted);
      margin-left: 4px;
      vertical-align: middle;
    }

    .summary-breakdown {
      margin-top: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
    }

    .breakdown-item {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .breakdown-item span { color: var(--text); }



    /* Animations */

    .action-row {
      margin-top: 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .clear-btn, .export-btn {
      padding: 0.85rem;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .clear-btn:hover { border-color: var(--error); color: var(--error); }

    .export-btn {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #0f0f0f;
    }
    .export-btn:hover { background: #d8ff5a; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.visible { display: flex; }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      width: min(340px, 90vw);
      animation: fadeUp 0.25s ease both;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .modal-text {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .modal-cancel {
      padding: 0.75rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .modal-confirm {
      padding: 0.75rem;
      background: var(--error);
      border: 1px solid var(--error);
      border-radius: 8px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .day-card:nth-child(1) { animation-delay: 0.05s; }
    .day-card:nth-child(2) { animation-delay: 0.10s; }
    .day-card:nth-child(3) { animation-delay: 0.15s; }
    .day-card:nth-child(4) { animation-delay: 0.20s; }
    .day-card:nth-child(5) { animation-delay: 0.25s; }

    @media (max-width: 480px) {
      .summary { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="kw-badge" id="kw-badge">KW —</div>
      <h1>Arbeits<span>zeit</span></h1>
      <p class="subtitle">Wochenstunden erfassen</p>
    </header>

    <div class="days-grid" id="days-grid"></div>

    <div class="summary">
      <div class="summary-label">Woche gesamt</div>
      <div class="summary-total" id="total-display">—<span class="unit"></span></div>
      <div class="summary-breakdown" id="breakdown"></div>
    </div>

    <div class="action-row">
      <button class="clear-btn" onclick="askClear()">↺ Zurücksetzen</button>
      <button class="export-btn" onclick="exportEmail()">✉ Per E-Mail senden</button>
    </div>

    <!-- Custom confirm modal -->
    <div class="modal-overlay" id="modal" onclick="closeModal()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-title">Woche zurücksetzen?</div>
        <div class="modal-text">Alle eingetragenen Zeiten werden gelöscht.</div>
        <div class="modal-actions">
          <button class="modal-cancel" onclick="closeModal()">Abbrechen</button>
          <button class="modal-confirm" onclick="confirmClear()">Ja, löschen</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const DAYS = [
      { key: 'mo', label: 'Montag' },
      { key: 'di', label: 'Dienstag' },
      { key: 'mi', label: 'Mittwoch' },
      { key: 'do', label: 'Donnerstag' },
      { key: 'fr', label: 'Freitag' },
    ];

    const STORAGE_KEY = 'arbeitszeit_v1';

    // --- KW badge ---
    function getKW(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const day = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - day);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
    }
    document.getElementById('kw-badge').textContent = 'KW ' + getKW(new Date());

    // --- State ---
    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch { return {}; }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // --- Helpers ---
    // Parse "HH:MM" from native time input → minutes
    function parseTime(val) {
      if (!val) return null;
      const m = val.match(/^(\d{2}):(\d{2})$/);
      if (m) return parseInt(m[1]) * 60 + parseInt(m[2]);
      return null;
    }

    // Parse break: "1,25" → 75 min, "0,5" → 30 min, "1" → 60 min, "30" → 30 min
    function parseBreak(val) {
      if (!val.trim()) return 0;
      val = val.trim().replace(',', '.');
      const n = parseFloat(val);
      if (isNaN(n)) return null;
      // If it looks like a decimal (has dot), treat as hours
      if (val.includes('.')) return Math.round(n * 60);
      // If whole number ≤ 12 treat as hours, else minutes
      if (Number.isInteger(n) && n <= 12) return n * 60;
      return n; // minutes
    }

    function minutesToDisplay(min) {
      const h = Math.floor(min / 60);
      const m = min % 60;
      return m === 0 ? `${h}:00` : `${h}:${String(m).padStart(2, '0')}`;
    }

    function calcDay(dayState) {
      const { start, end, brk } = dayState;
      if (!start || !end) return null;
      const s = parseTime(start);
      const e = parseTime(end);
      if (s === null || e === null) return null;
      let diff = e - s;
      if (diff < 0) diff += 24 * 60; // overnight edge case
      const b = parseBreak(brk || '0');
      if (b === null) return null;
      const worked = diff - b;
      return worked >= 0 ? worked : null;
    }

    // --- Build UI ---
    function buildGrid() {
      const grid = document.getElementById('days-grid');
      grid.innerHTML = '';
      DAYS.forEach(({ key, label }) => {
        const ds = state[key] || {};
        const card = document.createElement('div');
        card.className = 'day-card' + (ds.start || ds.end ? ' has-data' : '');
        card.id = 'card-' + key;

        const mins = calcDay(ds);
        const resultText = mins !== null ? minutesToDisplay(mins) + ' Std' : '—';
        const resultEmpty = mins === null;

        card.innerHTML = `
          <div class="day-header">
            <div class="day-name">${label}</div>
            <div class="day-result ${resultEmpty ? 'empty' : ''}" id="result-${key}">${resultText}</div>
          </div>
          <div class="inputs-row">
            <div class="field">
              <label>Beginn</label>
              <input type="time" id="${key}-start" value="${ds.start || ''}" />
            </div>
            <div class="field">
              <label>Ende</label>
              <input type="time" id="${key}-end" value="${ds.end || ''}" />
            </div>
            <div class="field full">
              <label>Pause (Std)</label>
              <input type="text" inputmode="decimal" id="${key}-brk" placeholder="0,75" value="${ds.brk || ''}" maxlength="5" />
            </div>
          </div>
        `;
        grid.appendChild(card);

        // Attach listeners
        ['start', 'end', 'brk'].forEach(field => {
          const el = document.getElementById(`${key}-${field}`);
          el.addEventListener('input', () => {
            state[key] = state[key] || {};
            state[key][field] = el.value;
            updateDay(key);
            updateTotal();
            saveState();
          });
        });
      });
    }

    function formatTimeField(el) {
      const val = el.value.trim();
      if (!val) return;
      // Auto-format time inputs to HH:MM
      if (el.id.includes('-start') || el.id.includes('-end')) {
        const mins = parseTime(val);
        if (mins !== null) {
          const h = Math.floor(mins / 60);
          const m = mins % 60;
          el.value = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
          const key = el.id.split('-')[0];
          const field = el.id.includes('start') ? 'start' : 'end';
          state[key] = state[key] || {};
          state[key][field] = el.value;
          saveState();
        }
      }
    }

    function updateDay(key) {
      const ds = state[key] || {};
      const mins = calcDay(ds);
      const el = document.getElementById('result-' + key);
      const card = document.getElementById('card-' + key);
      if (mins !== null) {
        el.textContent = minutesToDisplay(mins) + ' Std';
        el.classList.remove('empty');
        card.classList.add('has-data');
      } else {
        el.textContent = '—';
        el.classList.add('empty');
        card.classList.toggle('has-data', !!(ds.start || ds.end));
      }
    }

    function updateTotal() {
      let total = 0;
      let hasAny = false;
      const breakdown = [];

      DAYS.forEach(({ key, label }) => {
        const mins = calcDay(state[key] || {});
        if (mins !== null) {
          total += mins;
          hasAny = true;
          breakdown.push({ label: label.slice(0, 2), mins });
        }
      });

      const el = document.getElementById('total-display');
      const bd = document.getElementById('breakdown');

      if (hasAny) {
        el.innerHTML = `${minutesToDisplay(total)}<span class="unit">Std</span>`;
        bd.innerHTML = breakdown.map(b =>
          `<div class="breakdown-item">${b.label} <span>${minutesToDisplay(b.mins)}</span></div>`
        ).join('');
      } else {
        el.innerHTML = '—<span class="unit"></span>';
        bd.innerHTML = '';
      }
    }

    function askClear() {
      document.getElementById('modal').classList.add('visible');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('visible');
    }

    function confirmClear() {
      closeModal();
      state = {};
      saveState();
      buildGrid();
      updateTotal();
    }

    function exportEmail() {
      const kw = document.getElementById('kw-badge').textContent; // e.g. "KW 13"
      const subject = encodeURIComponent('Arbeitsstunden ' + kw);

      const pad = (s, n) => String(s).padEnd(n);
      const line = '-'.repeat(52);

      let rows = '';
      let totalMins = 0;
      let hasAny = false;

      DAYS.forEach(({ key, label }) => {
        const ds = state[key] || {};
        const mins = calcDay(ds);
        const worked = mins !== null ? minutesToDisplay(mins) + ' Std' : '—';
        if (mins !== null) { totalMins += mins; hasAny = true; }
        const brkVal = ds.brk ? ds.brk + ' Std' : '—';
        rows += pad(label, 12) + pad(ds.start || '—', 10) + pad(ds.end || '—', 10) + pad(brkVal, 10) + worked + '\n';
      });

      const total = hasAny ? minutesToDisplay(totalMins) + ' Std' : '—';

      const body =
        kw + ' – Arbeitszeiterfassung\n' +
        line + '\n' +
        pad('Tag', 12) + pad('Beginn', 10) + pad('Ende', 10) + pad('Pause', 10) + 'Gearbeitet\n' +
        line + '\n' +
        rows +
        line + '\n' +
        pad('GESAMT', 32) + total + '\n';

      window.location.href = 'mailto:?subject=' + subject + '&body=' + encodeURIComponent(body);
    }

    // --- Init ---
    buildGrid();
    updateTotal();
  </script>
</body>
</html>
